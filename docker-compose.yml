services:
    postgres:
        image: docker.io/library/postgres:17-alpine
        container_name: doraemon_db
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-doraemon}
            POSTGRES_USER: ${DB_USERNAME:-postgres}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
        ports:
            - '5432:5432'
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-doraemon}']
            interval: 5s
            timeout: 5s
            retries: 10

    app:
        build:
            context: .
            dockerfile: docker/app/Dockerfile
        container_name: doraemon_app
        restart: unless-stopped
        env_file: .env
        ports:
            - '8000:8000'
        volumes:
            - .:/var/www/html
            - /var/www/html/vendor
        depends_on:
            postgres:
                condition: service_healthy
        healthcheck:
            test: ['CMD-SHELL', 'curl -sf http://localhost:8000/up || exit 1']
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s

    vite:
        image: docker.io/library/node:22-alpine
        container_name: doraemon_vite
        working_dir: /var/www/html
        restart: unless-stopped
        ports:
            - '5173:5173'
        volumes:
            - .:/var/www/html
            - /var/www/html/node_modules
        command: sh -c "npm install && npm run dev"
        environment:
            - NODE_ENV=development

    queue:
        build:
            context: .
            dockerfile: docker/app/Dockerfile
        container_name: doraemon_queue
        restart: unless-stopped
        env_file: .env
        volumes:
            - .:/var/www/html
            - /var/www/html/vendor
        entrypoint: []
        command: ['php', 'artisan', 'queue:listen', '--tries=1', '--timeout=0']
        depends_on:
            app:
                condition: service_healthy

volumes:
    pgdata:
